<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spintax Generator v11</title>
<style>
:root{--blue:#FF6633;--blue-d:#D9491B;--line:#d5d9e0;--ink:#1d2430;--mute:#667085;--bad:#c62828;--warn:#a85d00;--ok:#1b7f3b}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#e9ebee}
header.top{display:flex;align-items:center;gap:10px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top h1{font-size:17px;margin:0}
.ver{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
.spacer{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:5px 11px}
button:hover{background:#f3f5f8}
button.primary{background:var(--blue);border-color:var(--blue-d);color:#fff}
button.primary:hover{background:var(--blue-d)}
button.small{padding:2px 8px;font-size:12px}
button.link{border:none;background:none;color:var(--blue-d);padding:2px 4px;text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
#tabs{display:flex;gap:6px;padding:12px 18px 0;flex-wrap:wrap;align-items:flex-end}
#tabs button.tab{background:var(--blue);color:#fff;border-color:var(--blue-d);border-radius:6px 6px 0 0;opacity:.72}
#tabs button.tab.active{opacity:1;background:#fff;color:var(--ink);border-bottom-color:#fff;font-weight:600}
#status{margin:0 18px;min-height:0}
#status .msg{margin-top:8px;padding:7px 11px;border-radius:6px;background:#fff1ec;border:1px solid #ffcdb9}
#status .msg.err{background:#fdecec;border-color:#f3b8b8;color:var(--bad)}
main{margin:0 18px 40px;background:#f6f7f9;border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:16px}
section{margin-bottom:18px}
h2{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--blue);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
input[type=text],input[type=number],input[type=password],select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:150px;resize:vertical;white-space:pre-wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;border-radius:10px;padding:1px 8px;border:1px solid var(--line);color:var(--mute);background:#fff}
.pill.bad{color:var(--bad);border-color:#f3b8b8;background:#fdecec}
.pill.warn{color:var(--warn);border-color:#f0d3a6;background:#fff7e8}
.pill.ok{color:var(--ok);border-color:#b9e0c5;background:#eefaf1}
#assembled .dark{background:#000;color:#fff;border-radius:6px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font:13px/1.55 Consolas,Menlo,monospace}
#assembled .dark .lbl{color:#9aa4b2;display:block;margin-bottom:3px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
#assembled .dark .gap{display:block;height:8px}
.left{border:1px solid var(--line);border-radius:6px;padding:10px;background:#fff;white-space:pre-wrap;word-break:break-word;min-height:60px}
.left .hl{border-radius:3px;padding:0 2px}
.left .fixed{cursor:text;outline:none}
.left .fixed:focus{background:#f3f6fb}
.left .fixed:empty{display:inline-block;min-width:8px;min-height:1em}
.hint{font-size:12px;color:var(--mute)}
.blk{border:1px solid var(--line);border-left-width:6px;border-radius:6px;padding:8px;margin-bottom:10px;background:#fff}
.blk .hd{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.blk .opt{display:flex;gap:6px;margin-bottom:5px;align-items:center}
.blk .opt .num{width:18px;color:var(--mute);font-size:12px;text-align:right}
.blk .outs{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px;font-size:13px}
.blk .outs div{padding:3px 6px;background:#f7f8fa;border-radius:4px;margin-bottom:3px;white-space:pre-wrap}
.iss{font-size:12px;margin-top:4px}
.iss .err{color:var(--bad)}
.iss .warn{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pin{position:sticky;top:var(--hdr,54px);z-index:4;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:18px;box-shadow:0 6px 8px -6px rgba(0,0,0,.25)}
.pin #assembled .dark{max-height:150px;overflow-y:auto}
.chip.cu{border-style:dashed}
.chip .x{margin-left:6px;color:var(--mute);font-size:11px}
.vrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.vrow .vchips{display:flex;gap:5px;flex-wrap:wrap}
.vrow .vnew{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.vrow .vform{display:none;align-items:center;gap:5px}
.vrow .vnew.open .vform{display:inline-flex}
.vrow .vnew.open .chip.add{display:none}
.vrow .vname{width:150px;padding:3px 7px;border:1px solid var(--line);border-radius:6px;font:12px Consolas,Menlo,monospace}
.vrow .br{font:12px Consolas,Menlo,monospace}
.vrow .verr{color:var(--bad);font-size:12px}
.chip.add{background:#fff;border-style:dashed;color:var(--blue-d)}
.chip.csv{background:#eef4ff;border-color:#c6d8fb}
.sigline{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sigline label{display:flex;align-items:center;gap:6px;cursor:pointer}
#assembled .dark .sig{color:#9aa4b2}
#statusLine{font-weight:600;font-size:14px;margin-bottom:6px}
#statusLine .go{font-weight:400;font-size:12px;margin-left:8px;color:var(--accent,#2563eb);cursor:pointer;text-decoration:underline}
#statusLine.ok{color:#15803d}#statusLine.tip{color:#a16207}#statusLine.bad{color:#b91c1c}
.tab .tag{font-size:10px;font-weight:400;color:var(--mute);margin-left:5px}
#platformDlg .pick{display:flex;gap:8px;margin:12px 0 6px}#platformDlg .pick button{flex:1;padding:12px}
.chip{font:12px Consolas,Menlo,monospace;border:1px solid #ffcdb9;background:#fff1ec;border-radius:12px;padding:1px 9px;cursor:pointer}
.mail{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;white-space:pre-wrap}
.mail .subj{color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
mark.miss{background:#fde2e2;color:var(--bad)}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;width:min(760px,94vw);max-height:90vh}
dialog .in{padding:16px;overflow:auto;max-height:80vh}
dialog .ft{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
dialog h2{margin-top:12px}
.warnbox{background:#fff7e8;border:1px solid #f0d3a6;border-radius:6px;padding:6px 9px;font-size:12px;color:#6b4300}
.help{max-width:900px}
.help h3{margin:22px 0 6px;font-size:15px}
.help p,.help li{margin:4px 0}
.help ol,.help ul{margin:6px 0 6px 20px;padding:0}
.help .ex{font:13px/1.5 Consolas,Menlo,monospace;background:#f3f4f6;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.help code{font:12.5px Consolas,Menlo,monospace;background:#f3f4f6;border-radius:4px;padding:1px 5px}
.help .good{color:var(--ok);font-weight:600}
.help .badx{color:var(--bad);font-weight:600}
.help .lbl{font-size:12px;color:var(--mute);margin-top:8px}
#tabs .spacer{flex:1}
.xstep{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:#fff}
.xstep label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer}
.xstep .xs{font:12px/1.5 Consolas,Menlo,monospace;background:#000;color:#fff;border-radius:6px;padding:8px 10px;margin-top:6px;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto}
</style>
</head>
<body>
<header class="top">
  <h1>Spintax Generator</h1><span class="ver">v11</span>
  <div class="spacer"></div>
  <button data-a="project-open">Open project</button>
  <button data-a="project-save">Save project</button>
  <button data-a="export-open">Export final versions</button>
  <button data-a="settings-open">Settings</button>
  <button data-a="reset-all" title="Clear all steps, contacts and settings">Reset tool</button>
</header>
<nav id="tabs"></nav>
<div id="status"></div>
<main id="main"></main>

<dialog id="settings"><div class="in" id="settingsBody"></div>
  <div class="ft"><button data-a="settings-close">Cancel</button><button class="primary" data-a="settings-save">Save settings</button></div>
</dialog>
<dialog id="platformDlg"><div class="in">
  <h2 style="margin-top:0">Where will you send these messages?</h2>
  <div class="hint">This sets the spintax format and the variable names for every step. You can change a single step later in section 2.</div>
  <div class="pick"><button class="primary" data-a="plat" data-p="instantly">Instantly</button><button data-a="plat" data-p="salesforge">Salesforge</button><button data-a="plat" data-p="custom">Custom</button></div>
</div></dialog>
<dialog id="exportDlg"><div class="in" id="exportBody"></div>
  <div class="ft"><button data-a="export-close">Cancel</button><button data-a="export-copy">Copy selected</button><button data-a="export-txt">Download .txt</button><button class="primary" data-a="export-docx">Download Word (.docx)</button></div>
</dialog>
<input type="file" id="fileProject" accept=".json" hidden>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>

<script>
"use strict";
/* ===================== helpers ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => "i" + Math.random().toString(36).slice(2, 9);
const PALETTE = ["#ff4df0", "#8fd61c", "#2ec5ff", "#ffb020", "#ff6b6b", "#a78bfa", "#2dd4bf", "#f472b6"];
const colorFor = i => PALETTE[i % PALETTE.length];

/* ===================== formats ===================== */
const FORMATS = {
  salesforge: { name: "Salesforge {{a|b}}", verified: true, open: "{{", close: "}}", prefix: "", sep: "|", quote: "", varOpen: "{{", varClose: "}}" },
  single: { name: "Single brace {a|b} with {{var}}", verified: false, open: "{", close: "}", prefix: "", sep: "|", quote: "", varOpen: "{{", varClose: "}}" },
  instantly: { name: "Instantly {{RANDOM | a | b}}", verified: true, open: "{{", close: "}}", prefix: "RANDOM | ", sep: " | ", quote: "", varOpen: "{{", varClose: "}}" },
  reply: { name: "Reply.io {{Random | 'a' | 'b'}}", verified: false, open: "{{", close: "}}", prefix: "Random | ", sep: " | ", quote: "'", varOpen: "{{", varClose: "}}" },
  pipl: { name: "Pipl {{random|a|b}}", verified: false, open: "{{", close: "}}", prefix: "random|", sep: "|", quote: "", varOpen: "{{", varClose: "}}" },
  custom: { name: "Custom (edit in Settings)", verified: false }
};

/* ===================== settings + state ===================== */
const DEFAULT_SETTINGS = {
  formatId: "salesforge", formatAsked: false, pad: false,
  vars: [],
  customVarNames: [],
  placeholderMap: "[Name] = first_name\n[First Name] = first_name\n[Company] = company_nickname",
  maxSpins: 5,
  customFormat: { open: "{", close: "}", prefix: "", sep: "|", quote: "", varOpen: "{{", varClose: "}}" }
};
let settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
let state = { tabs: [], active: null };
let busy = false;
let helpOpen = false;
let lastOpt = null;            // last focused option input, for variable chips
let contacts = { headers: [], rows: [], map: {}, idx: 0, name: "" };
let prev = { picks: {} };      // preview picks per spin id

function newTab(name, channel) {
  return { id: uid(), name, channel, charLimit: channel === "linkedin" ? 300 : 0, subject: "", body: "", paras: [], dirty: false, note: "", formatId: null };
}
function activeTab() { return state.tabs.find(t => t.id === state.active) || state.tabs[0]; }

/* Older versions kept an API key and model in browser storage. v5 never holds either, so drop them if present. */
function stripKeyFields(o) { delete o.apiKey; delete o.rememberKey; delete o.model; return o; }
function persist() {
  try {
    localStorage.setItem("spintax_v1_settings", JSON.stringify(settings));
    localStorage.setItem("spintax_v1_state", JSON.stringify(state));
  } catch (e) { /* storage can be unavailable */ }
}
function restore() {
  try {
    const s = localStorage.getItem("spintax_v1_settings");
    if (s) {
      const saved = JSON.parse(s), hadKey = "apiKey" in saved || "rememberKey" in saved || "model" in saved;
      settings = stripKeyFields(Object.assign({}, DEFAULT_SETTINGS, saved));
      if (hadKey) localStorage.setItem("spintax_v1_settings", JSON.stringify(settings));   // wipe a key left by an older version
    }
    const t = localStorage.getItem("spintax_v1_state");
    if (t) { const p = JSON.parse(t); if (p && Array.isArray(p.tabs) && p.tabs.length) state = p; }
  } catch (e) { /* ignore */ }
  /* v10: settings.vars holds only the variables you added. The built-in names now come from the platform. */
  settings.vars = (Array.isArray(settings.vars) ? settings.vars : []).filter(v => !BASE_SALESFORGE.includes(v) && !BASE_INSTANTLY.includes(v));
  if (!Array.isArray(settings.customVarNames)) settings.customVarNames = [];
  if (!state.tabs.length) {
    state.tabs = [newTab("Email 1A", "email"), newTab("LinkedIn after connect", "linkedin")];
    state.active = state.tabs[0].id;
  }
  if (!state.tabs.find(t => t.id === state.active)) state.active = state.tabs[0].id;
}

/* ===================== text rules ===================== */
const VAR_RE = /\{\{\s*([A-Za-z0-9_]+)\s*\}\}/g;
const NUM_RE = /\$?\d[\d,]*(?:\.\d+)?(?:\s?(?:x|MM|M|K|B)\b|%)?/gi;
const WORD_NUM_RE = /\b(?:two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|thousand|million|billion|dozen)\b/gi;

/* ===================== platforms and variable names ===================== */
const BASE_SALESFORGE = ["first_name", "last_name", "company_name", "company_nickname"];
const BASE_INSTANTLY = ["firstName", "lastName", "companyName", "personalization"];
/* Sender variables are filled in by the platform from the sending account. They are never chips, CSV columns or custom variables. */
const SENDER_INSTANTLY = ["accountSignature"];
const SIG_VAR = "accountSignature";
const SIGNOFF_RE = /^(best|best regards|kind regards|warm regards|regards|thanks|thank you|many thanks|cheers|sincerely|talk soon|all the best|yours truly|take care)\s*[,.!]?$/i;
function fidOf(tab) { const t = tab || activeTab(); return (t && t.formatId) || settings.formatId; }
function styleOf(fid) { return fid === "instantly" ? "instantly" : fid === "custom" ? "custom" : "salesforge"; }
function baseVars(fid) {
  const st = styleOf(fid);
  if (st === "instantly") return BASE_INSTANTLY;
  if (st === "custom") return settings.customVarNames.length ? settings.customVarNames : BASE_SALESFORGE;
  return BASE_SALESFORGE;
}
function vkey(n) { return String(n).toLowerCase().replace(/[^a-z0-9]/g, ""); }
function senderVars(fid) { return styleOf(fid) === "instantly" ? SENDER_INSTANTLY : []; }
function knownVars(fid) { return Array.from(new Set(baseVars(fid).concat(senderVars(fid), settings.vars))); }
/* Instantly adds the sending account's signature. On by default for email steps, and a step can switch it off. Salesforge adds its own. */
function sigAvailable(tab) { const t = tab || activeTab(); return !!t && styleOf(fidOf(t)) === "instantly" && t.channel === "email"; }
function sigOn(tab) { const t = tab || activeTab(); return sigAvailable(t) && t.sig !== false; }
/* firstName, first_name and "First Name" are one variable. The output always uses the platform's own spelling. */
function mapVarName(n, fid) {
  const k = knownVars(fid);
  if (k.includes(n)) return n;
  return k.find(x => vkey(x) === vkey(n)) || n;
}
function platformLabel(fid) { const f = FORMATS[fid]; return fid === "custom" ? "Custom" : f ? f.name.split(" ")[0] : "Salesforge"; }
function getFmt(tab) {
  const id = fidOf(tab);
  const base = id === "custom" ? Object.assign({ name: "Custom", verified: false }, settings.customFormat) : (FORMATS[id] || FORMATS.salesforge);
  return Object.assign({}, base, { fid: id === "custom" || FORMATS[id] ? id : "salesforge" });
}
function varsIn(t) { return Array.from(String(t).matchAll(VAR_RE)).map(m => m[1]); }
function stripVars(t) { return String(t).replace(VAR_RE, ""); }
function serText(t, fmt) { return String(t).replace(VAR_RE, (m, n) => fmt.varOpen + mapVarName(n, fmt.fid) + fmt.varClose); }
function numTokens(t) { return (stripVars(t).match(NUM_RE) || []).map(x => x.toLowerCase().replace(/[,\s]/g, "")).sort(); }
function wordNums(t) { return Array.from(new Set((String(t).match(WORD_NUM_RE) || []).map(x => x.toLowerCase()))).sort(); }
function canon(t) { return String(t).replace(VAR_RE, (m, n) => "{{" + n + "}}"); }

function parsePlaceholderMap(txt) {
  return String(txt || "").split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.lastIndexOf("=");
    if (i < 1) return null;
    return [l.slice(0, i).trim(), l.slice(i + 1).trim()];
  }).filter(Boolean);
}
function applyPlaceholders(text) {
  let out = String(text);
  for (const [tok, v] of parsePlaceholderMap(settings.placeholderMap)) {
    const re = new RegExp(tok.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    out = out.replace(re, "{{" + v + "}}");
  }
  /* [First name] and {firstName} also turn into the platform's variable when the name matches one the platform knows */
  const fid = fidOf(), known = knownVars(fid);
  const hit = n => known.find(x => vkey(x) === vkey(n));
  out = out.replace(/\[([^\]]+)\]/g, (m, n) => hit(n) ? "{{" + hit(n) + "}}" : m);
  out = out.replace(/(^|[^{])\{([A-Za-z][A-Za-z0-9_ -]*)\}(?!\})/g, (m, pre, n) => hit(n) ? pre + "{{" + hit(n) + "}}" : m);
  return canon(out);
}

/* spin string */
function spinStr(options, fmt, pad) {
  const q = fmt.quote || "";
  let inner = fmt.prefix + options.map(o => q + serText(o, fmt) + q).join(pad ? " " + fmt.sep.trim() + " " : fmt.sep);
  if (pad) {
    // matches the tested form {{ quick | }}
    if (fmt.prefix) inner = fmt.prefix + options.map(o => q + serText(o, fmt) + q).join(fmt.sep);
    return fmt.open + " " + inner + (inner.endsWith(" ") ? "" : " ") + fmt.close;
  }
  return fmt.open + inner + fmt.close;
}

/* ===================== segments ===================== */
function fixedSeg(text) { return { t: "fixed", id: uid(), text }; }
function spinSeg(options) { return { t: "spin", id: uid(), orig: options[0], options: options.slice() }; }
function mergeFixed(segs) {
  const out = [];
  for (const s of segs) {
    if (s.t === "fixed") {
      if (!s.text) continue;
      const last = out[out.length - 1];
      if (last && last.t === "fixed") { last.text += s.text; continue; }
    }
    out.push(s);
  }
  return out;
}
function allTextOf(tab) {
  return [tab.subject, tab.body].concat(tab.paras.flatMap(p => p.segs.map(s => s.t === "fixed" ? s.text : s.options.join(" ")))).join(" ");
}
/* Variables the platform does not know become custom variables, so nobody has to open Settings for {{descriptor}} */
function registerUnknownVars(tab) {
  const fid = fidOf(tab), added = [];
  for (const v of new Set(varsIn(allTextOf(tab)))) {
    if (knownVars(fid).includes(v) || mapVarName(v, fid) !== v) continue;
    settings.vars.push(v); added.push(v);
  }
  if (added.length) { persist(); renderVarRows(); automap(); say("Added " + added.map(v => "{{" + v + "}}").join(", ") + " as a custom variable. Pick its CSV column in step 3 if you use a CSV."); }
  return added;
}
function spinsOf(p) { return p.segs.filter(s => s.t === "spin"); }
function allSpins(tab) { return tab.paras.flatMap(spinsOf); }
function textFor(p, picks) { let i = 0; return p.segs.map(s => s.t === "fixed" ? s.text : (s.options[picks[i++]] || "")).join(""); }
function zeroPicks(p) { return spinsOf(p).map(() => 0); }
function paraCombos(p) { return spinsOf(p).reduce((a, s) => a * Math.max(1, s.options.length), 1); }
function totalCombos(tab) { return tab.paras.reduce((a, p) => a * paraCombos(p), 1); }
function* comboPicks(p, cap) {
  const spins = spinsOf(p), total = paraCombos(p);
  if (total <= cap) {
    for (let n = 0; n < total; n++) {
      let x = n; const picks = [];
      for (const s of spins) { const k = Math.max(1, s.options.length); picks.push(x % k); x = Math.floor(x / k); }
      yield picks;
    }
  } else {
    for (let k = 0; k < cap; k++) yield spins.map(s => Math.floor(Math.random() * Math.max(1, s.options.length)));
  }
}
function splitParagraphs(body) { return String(body).replace(/\r\n/g, "\n").trim().split(/\n\s*\n/).map(x => x.trim()).filter(Boolean); }

function buildParas(tab) {
  const paras = [];
  const subj = applyPlaceholders(tab.subject.trim());
  if (tab.channel === "email" && subj) paras.push({ id: uid(), kind: "subject", orig: subj, segs: [fixedSeg(subj)], note: "" });
  for (const b of splitParagraphs(applyPlaceholders(tab.body))) paras.push({ id: uid(), kind: "body", orig: b, segs: [fixedSeg(b)], note: "" });
  tab.paras = paras; tab.dirty = false;
}

/* Parse existing spintax in the pasted text (Salesforge {{a|b}} or single-brace {a|b}); flat only */
function parseSpintaxString(text) {
  const segs = []; let i = 0, buf = "";
  const flush = () => { if (buf) { segs.push(fixedSeg(buf)); buf = ""; } };
  while (i < text.length) {
    if (text.startsWith("{{", i)) {
      const j = text.indexOf("}}", i + 2);
      if (j > -1) {
        const inner = text.slice(i + 2, j);
        if (inner.includes("|") && !inner.includes("{")) { flush(); segs.push(spinSeg(inner.split("|").map(x => x.trim()))); i = j + 2; continue; }
        buf += text.slice(i, j + 2); i = j + 2; continue;
      }
    } else if (text[i] === "{") {
      const j = text.indexOf("}", i + 1);
      if (j > -1) {
        const inner = text.slice(i + 1, j);
        if (inner.includes("|") && !inner.includes("{")) { flush(); segs.push(spinSeg(inner.split("|").map(x => x.trim()))); i = j + 1; continue; }
      }
    }
    buf += text[i]; i++;
  }
  flush();
  return mergeFixed(segs);
}

/* ===================== checks ===================== */
function needsAn(w) {
  if (/^(hour|honest|honor|honour|heir)/.test(w)) return true;
  if (/^(uni|use|usu|eu|one|once|ubiq|uran|utensil)/.test(w)) return false;
  return /^[aeiou]/.test(w);
}
function textRuleIssues(text, label) {
  const out = [];
  const fidK = fidOf(), kn = knownVars(fidK);
  for (const v of varsIn(text)) if (!kn.includes(v) && mapVarName(v, fidK) === v) out.push({ lvl: "warn", msg: `${label}: unknown variable {{${v}}}. It becomes a custom variable when you click away.` });
  if (/[{}|]/.test(stripVars(text))) out.push({ lvl: "err", msg: `${label}: contains a brace or pipe that is not a variable.` });
  const q = getFmt().quote;
  if (q && text.includes(q)) out.push({ lvl: "err", msg: `${label}: contains the quote character ${q} used by this format.` });
  if (/[\u2013\u2014]/.test(text)) out.push({ lvl: "err", msg: `${label}: contains a long dash. Use a comma or period.` });
  if (/\[[^\]]+\]/.test(text)) out.push({ lvl: "warn", msg: `${label}: has a square bracket placeholder. Map it to a variable in Settings.` });
  return out;
}
function spinIssues(s) {
  const out = []; const opts = s.options;
  if (opts.length < 2) out.push({ lvl: "err", msg: "Needs at least 2 options." });
  if (opts.length > 4) out.push({ lvl: "warn", msg: "More than 4 options rarely adds real variation." });
  if (opts.every(o => o.trim() === "")) out.push({ lvl: "err", msg: "All options are empty." });
  const seen = new Map();
  const fidS = fidOf(), nv = x => mapVarName(x, fidS), vin = t => varsIn(t).map(nv);
  const ov = Array.from(new Set(vin(s.orig))), on = numTokens(s.orig), ow = wordNums(s.orig);
  opts.forEach((o, i) => {
    const k = o.trim().toLowerCase();
    if (seen.has(k)) out.push({ lvl: "warn", msg: `Option ${i + 1} repeats option ${seen.get(k) + 1}.` }); else seen.set(k, i);
    out.push(...textRuleIssues(o, `Option ${i + 1}`));
    const miss = ov.filter(v => !vin(o).includes(v));
    if (miss.length) out.push({ lvl: "err", msg: `Option ${i + 1} drops {{${miss.join("}}, {{")}}} from the original.` });
    const extra = Array.from(new Set(vin(o))).filter(v => !ov.includes(v));
    if (extra.length) out.push({ lvl: "warn", msg: `Option ${i + 1} adds {{${extra.join("}}, {{")}}} that the original does not have.` });
    const nn = numTokens(o);
    if (JSON.stringify(nn) !== JSON.stringify(on)) out.push({ lvl: "err", msg: `Option ${i + 1} changes the numbers. Original: ${on.join(", ") || "none"}. This option: ${nn.join(", ") || "none"}.` });
    const wn = wordNums(o);
    if (JSON.stringify(wn) !== JSON.stringify(ow)) out.push({ lvl: "warn", msg: `Option ${i + 1} changes a counted word. Original: ${ow.join(", ") || "none"}. This option: ${wn.join(", ") || "none"}.` });
  });
  return out;
}
function comboTextIssues(t0, kind) {
  const out = [];
  const t = t0.replace(VAR_RE, "VARIABLEX").replace(/\b(?:e\.g|i\.e|etc|vs|approx|inc|ltd|corp|co)\./gi, "X");
  if (/ {2,}/.test(t.replace(/\n +/g, "\n"))) out.push("Double space");
  if (/ [,.;:!?]/.test(t)) out.push("Space before punctuation");
  if (/[,;:][A-Za-z]/.test(t)) out.push("Missing space after punctuation");
  if (kind !== "subject" && /(^|[.!?]\s+)[a-z]/.test(t)) out.push("Sentence starts with a lowercase letter");
  const rep = t.match(/\b([A-Za-z']+)\s+\1\b/i);
  if (rep) out.push(`Repeated word "${rep[1]}"`);
  const re = /\b(a|an)\s+([A-Za-z][A-Za-z'-]*)/gi; let m;
  while ((m = re.exec(t))) {
    const art = m[1].toLowerCase(), w = m[2];
    const nextCh = t[m.index + m[0].length] || "";
    if (w.toLowerCase() === "variablex" || /^[A-Z]{2,}$/.test(w) || (/^[A-Z]$/.test(w) && /[&.]/.test(nextCh))) continue;
    const an = needsAn(w.toLowerCase());
    if (art === "a" && an) out.push(`"${m[1]} ${w}" should probably be "an ${w}"`);
    if (art === "an" && !an) out.push(`"${m[1]} ${w}" should probably be "a ${w}"`);
  }
  if (/[\u2013\u2014]/.test(t)) out.push("Long dash");
  return out;
}
function comboIssues(p, cap) {
  const spins = spinsOf(p); if (!spins.length) return { list: [], checked: 0, total: 1 };
  const total = paraCombos(p); const found = new Map(); let checked = 0;
  for (const picks of comboPicks(p, cap)) {
    checked++;
    const txt = textFor(p, picks);
    for (const msg of comboTextIssues(txt, p.kind)) {
      const e = found.get(msg) || { msg, count: 0, picks };
      e.count++; found.set(msg, e);
    }
  }
  return { list: Array.from(found.values()), checked, total };
}
function describePicks(p, picks) { return spinsOf(p).map((s, i) => `block ${blockNumber(s.id)} option ${picks[i] + 1}`).join(", "); }
function maxLength(tab) {
  let total = 0;
  tab.paras.forEach((p, i) => {
    if (p.kind === "subject") return;
    let mx = 0;
    for (const picks of comboPicks(p, 2000)) mx = Math.max(mx, textFor(p, picks).replace(VAR_RE, "XXXXXXXX").length);
    total += mx + (i ? 2 : 0);
  });
  return total;
}
function blockNumber(spinId) {
  const tab = activeTab(); const all = allSpins(tab);
  return all.findIndex(s => s.id === spinId) + 1;
}

/* ===================== rendering text ===================== */
function renderSegsPlain(p, fmt) {
  return p.segs.map(s => s.t === "fixed" ? serText(s.text, fmt) : spinStr(s.options, fmt, settings.pad)).join("");
}
function renderSegsColored(p, fmt, idxOf) {
  return p.segs.map(s => {
    if (s.t === "fixed") return esc(serText(s.text, fmt));
    return `<span style="color:${colorFor(idxOf.get(s.id) || 0)}">${esc(spinStr(s.options, fmt, settings.pad))}</span>`;
  }).join("");
}
function assemblePlain(tab, fmt) {

/* ===================== Claude ===================== */
/* No Claude key ever reaches the browser. Every Claude call goes to the dashboard server, which owns the
   prompts, the model and the limits. The page only says which kind of call it wants and sends the text to work on. */
const SPINTAX_CONFIG = Object.assign({ apiBase: "https://outreach-sync-production.up.railway.app", path: "/dashboard/spintax/claude" }, window.SPINTAX_CONFIG || {});
let dashKey = null;            // the dashboard password, handed over by the dashboard page (never stored here)
function setDashKey(k) { dashKey = k ? String(k) : null; }
window.addEventListener("message", e => {
  if (e.origin !== window.location.origin || e.source !== window.parent) return;
  const m = e.data;
  if (m && m.type === "spintax-key" && typeof m.key === "string") { setDashKey(m.key); if (typeof say === "function") say("Connected to the dashboard."); }
});
function askParentForKey() {
  if (window.parent && window.parent !== window) window.parent.postMessage({ type: "spintax-ready" }, window.location.origin);
}
const CLAUDE_ERRORS = {
  401: "The dashboard session is not valid. Log out of the dashboard and sign in again.",
  413: "That message is too long to send to Claude.",
  429: "Too many Claude requests just now. Wait a minute and try again.",
  503: "Claude is not set up on the server yet.",
  502: "Claude did not answer. Try again in a moment."
};
async function callClaude(kind, payload) {
  if (!dashKey) throw new Error("Open this tool from the dashboard and sign in first.");
  let res;
  try {
    res = await fetch(SPINTAX_CONFIG.apiBase + SPINTAX_CONFIG.path, {
      method: "POST",
      headers: { "content-type": "application/json", "x-dashboard-key": dashKey },
      body: JSON.stringify({ kind, payload })
    });
  } catch (e) { throw new Error("Can't reach the server. Nothing was changed."); }
  let data = null;
  try { data = await res.json(); } catch (e) { /* ignore */ }
  if (!res.ok) throw new Error(CLAUDE_ERRORS[res.status] || (res.status === 400 ? "The server did not accept that request." : "Request failed (" + res.status + ")."));
  return String((data && data.text) || "");
}
function extractJson(t) {
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b < a) throw new Error("Claude did not return JSON.");
  return JSON.parse(t.slice(a, b + 1));
}
/* The prompts for all three Claude calls live on the server, not in this page. */
function applyClaudeSegments(p, raw) {
  if (!Array.isArray(raw)) return { ok: false, why: "no segments returned" };
  const segs = [];
  for (const r of raw) {
    if (r && r.t === "fixed" && typeof r.text === "string") segs.push(fixedSeg(canon(r.text)));
    else if (r && r.t === "spin" && Array.isArray(r.options) && r.options.length && r.options.every(o => typeof o === "string")) {
      const seen = new Set(), opts = [];
      r.options.map(canon).forEach(o => { const k = o.trim().toLowerCase(); if (!seen.has(k)) { seen.add(k); opts.push(o); } });
      segs.push(spinSeg(opts));
    } else return { ok: false, why: "malformed segment" };
  }
  const merged = mergeFixed(segs);
  const rebuilt = merged.map(s => s.t === "fixed" ? s.text : s.options[0]).join("");
  if (rebuilt !== p.orig) return { ok: false, why: "the split did not reproduce the original text exactly" };
  return { ok: true, segs: merged };
}
async function runClaude(onlyParaId) {
  const tab = activeTab();
  if (!onlyParaId) { buildParas(tab); registerUnknownVars(tab); }
  const targets = tab.paras.filter(p => !onlyParaId || p.id === onlyParaId);
  if (!targets.length) { say("Nothing to spin. Paste an email first.", true); return; }
  const max = onlyParaId ? 2 : settings.maxSpins;
  const payload = {
    channel: tab.channel, char_limit: tab.charLimit || null, max_spin_points: max,
    paragraphs: targets.map((p, i) => ({ index: i, kind: p.kind, text: p.orig }))
  };
  setBusy(true, onlyParaId ? "Asking Claude to re-spin this paragraph..." : "Asking Claude for spin points...");
  try {
    const txt = await callClaude("spin", payload);
    const j = extractJson(txt);
    let bad = 0;
    targets.forEach((p, i) => {
      const hit = (j.paragraphs || []).find(x => x.index === i);
      const r = hit ? applyClaudeSegments(p, hit.segments) : { ok: false, why: "missing from reply" };
      if (r.ok) { p.segs = r.segs; p.note = ""; }
      else { p.segs = [fixedSeg(p.orig)]; p.note = "Kept as original because " + r.why + ". Use Re-spin to try again."; bad++; }
    });
    const n = allSpins(tab).length;
    say(`Done. ${n} spin point${n === 1 ? "" : "s"} proposed.` + (bad ? ` ${bad} paragraph${bad === 1 ? "" : "s"} kept as original, see notes.` : "") + (n > settings.maxSpins && !onlyParaId ? ` That is more than your target of ${settings.maxSpins}, consider removing the weakest.` : ""));
  } catch (e) { say("Claude error: " + e.message, true); }
  shufflePrev(); setBusy(false); persist(); renderAll();
}
async function suggestOptions(spinId) {
  const tab = activeTab(); let P = null, S = null;
  tab.paras.forEach(p => p.segs.forEach(s => { if (s.id === spinId) { P = p; S = s; } }));
  if (!S) return;
  const marked = P.segs.map(s => s === S ? "<<<" + S.orig + ">>>" : s.t === "fixed" ? s.text : s.options[0]).join("");
  setBusy(true, "Asking Claude for more options...");
  try {
    const txt = await callClaude("suggest", { paragraph: marked, existing_options: S.options });
    const j = extractJson(txt);
    const have = new Set(S.options.map(o => o.trim().toLowerCase()));
    (j.options || []).filter(o => typeof o === "string").map(canon).forEach(o => { const k = o.trim().toLowerCase(); if (!have.has(k)) { have.add(k); S.options.push(o); } });
    say("Added options. Check the notes under the block.");
  } catch (e) { say("Claude error: " + e.message, true); }
  setBusy(false); persist(); renderAll();
}
async function reviewWithClaude() {
  const tab = activeTab();
  const targets = tab.paras.filter(p => spinsOf(p).length);
  if (!targets.length) { say("No spin points to review.", true); return; }
  setBusy(true, "Asking Claude to read the combinations...");
  try {
    for (const p of targets) {
      const seen = new Map();
      for (const picks of comboPicks(p, 4000)) { const t = textFor(p, picks); if (!seen.has(t)) seen.set(t, picks); }
      let texts = Array.from(seen.keys()); const total = texts.length; let sampled = false;
      if (texts.length > 40) { sampled = true; texts = texts.sort(() => Math.random() - 0.5).slice(0, 40); }
      const txt = await callClaude("review", { original: p.orig, variants: texts.map((t, i) => ({ n: i + 1, text: t })) });
      const j = extractJson(txt);
      p.review = { sampled, total, checked: texts.length, flags: (j.flags || []).map(f => ({ text: texts[(f.n | 0) - 1] || "", problem: String(f.problem || "") })).filter(f => f.text) };
    }
    say("Claude review finished.");
  } catch (e) { say("Claude error: " + e.message, true); }
  setBusy(false); persist(); renderAll();
}

  if (varsIn(text).some(v => vkey(v) === vkey(SIG_VAR))) out.push({ lvl: "warn", msg: "The message already contains {{" + SIG_VAR + "}}. The signature is added for you at the end, so remove it from the text or turn off Add signature for this step." });
  const bodies = tab.paras.filter(p => p.kind === "body"), last = bodies[bodies.length - 1];

  for (const p of tab.paras) {

function renderAll() {
  renderTabs();
  if (helpOpen) { $("#main").innerHTML = viewHelp(); return; }
  const tab = activeTab();
  $("#main").innerHTML = viewOriginal(tab) + viewAssembled(tab) + viewPreview(tab) + viewParas(tab);
  renderVarRows();
  renderDerived();
}

function renderDerived() {
  const tab = activeTab(), fmt = getFmt();
  const idxOf = new Map(allSpins(tab).map((s, i) => [s.id, i]));
  /* assembled */
  const subj = tab.paras.filter(p => p.kind === "subject").map(p => renderSegsColored(p, fmt, idxOf)).join("");
  const body = tab.paras.filter(p => p.kind === "body").map(p => renderSegsColored(p, fmt, idxOf)).join('<span class="gap"></span>') + (sigOn(tab) && tab.paras.length ? `<span class="gap"></span><span class="sig">${esc(fmt.varOpen + SIG_VAR + fmt.varClose)}</span>` : "");
  const asm = $("#assembled");
  if (asm) asm.innerHTML = tab.paras.length ? `<div class="dark">${tab.channel === "email" && subj ? `<span class="lbl">Subject</span>${subj}<span class="gap"></span>` : ""}<span class="lbl">${tab.channel === "email" ? "Body" : "Message"}</span>${body}</div>` : `<div class="hint">Nothing assembled yet.</div>`;
  const sg = $("#sigLine");
  if (sg) {
    if (sigAvailable(tab)) sg.innerHTML = `<label><input type="checkbox" data-f="sig"${sigOn(tab) ? " checked" : ""}> Add signature</label><span class="hint">Instantly fills in the sending account's signature at the end of the email.</span>`;
    else if (styleOf(fidOf(tab)) === "salesforge" && tab.channel === "email") sg.innerHTML = `<span class="hint">Salesforge adds the signature automatically, so nothing is added here.</span>`;
    else sg.innerHTML = "";
  }
  const ti = $("#tabIssues");
  if (ti) ti.innerHTML = tabIssues(tab).map(i => `<div class="${i.lvl}">${esc(i.msg)}</div>`).join("");
  const fn = $("#fmtNote");
  if (fn) fn.innerHTML = fmt.verified ? "" : `<div class="warnbox">This format comes from vendor documentation found by search and has not been tested by you. Paste one step into the tool and check its preview before launching.</div>`;
  /* stats + counts */
  const c = counts(tab), total = totalCombos(tab);
  const st = $("#stats");
  if (st) {
    const spins = allSpins(tab).length;
    let len = "";
    if (tab.charLimit && tab.paras.length) { const m = maxLength(tab); len = `<span class="pill ${m > tab.charLimit ? "bad" : "ok"}">longest ${m} of ${tab.charLimit} chars</span>`; }
    st.innerHTML = `<span class="pill">Sending from ${esc(platformLabel(fidOf(tab)))}</span><span class="pill">${spins} spin point${spins === 1 ? "" : "s"}</span><span class="pill">${total > 1e12 ? "more than 1 trillion" : total.toLocaleString()} unique versions</span>${len}<span class="pill ${c.err ? "bad" : "ok"}">${c.err} error${c.err === 1 ? "" : "s"}</span><span class="pill ${c.warn ? "warn" : "ok"}">${c.warn} warning${c.warn === 1 ? "" : "s"}</span>`;
  }
  const sl = $("#statusLine");
  if (sl) {
    if (!tab.paras.length) { sl.className = ""; sl.textContent = ""; }
    else if (c.err) { sl.className = "bad"; sl.innerHTML = `${c.err} thing${c.err === 1 ? "" : "s"} to fix<span class="go" data-a="goto-issue">Show me</span>`; }
    else if (c.warn) { sl.className = "tip"; sl.innerHTML = `Ready to paste, with ${c.warn} tip${c.warn === 1 ? "" : "s"}<span class="go" data-a="goto-issue">Show me</span>`; }
    else { sl.className = "ok"; sl.textContent = "Ready to paste"; }
  }
  /* per paragraph */
  for (const p of tab.paras) {
    const pi = $(`[data-pissues="${p.id}"]`);
    if (pi) {
      const iss = p.segs.filter(s => s.t === "fixed").flatMap(s => textRuleIssues(s.text, "Fixed text"));
      const ci = comboIssues(p, 1500);
      pi.innerHTML = iss.map(i => `<div class="${i.lvl}">${esc(i.msg)}</div>`).join("") +
        ci.list.map(e => `<div class="warn">${esc(e.msg)} in ${e.count} of ${ci.checked} checked combinations. Example: ${esc(describePicks(p, e.picks))}.</div>`).join("");
      const pill = $(`[data-pill="${p.id}"]`);
      if (pill) { const n = paraCombos(p); pill.textContent = n + " version" + (n === 1 ? "" : "s"); }
    }
    for (const s of spinsOf(p)) {
      const el = $(`[data-iss="${s.id}"]`);
      if (el) el.innerHTML = spinIssues(s).map(i => `<div class="${i.lvl}">${esc(i.msg)}</div>`).join("");
      const out = $(`[data-outs="${s.id}"]`);
      if (out) {
        out.innerHTML = `<div class="hint" style="margin-bottom:3px">Output</div>` + s.options.map((o, k) => {
          const html = p.segs.map(x => x.t === "fixed" ? esc(x.text) : (x === s ? `<b>${esc(o)}</b>` : esc(x.options[0]))).join("");
          return `<div>${html}</div>`;
        }).join("");
      }
    }
  }
  renderPreview();
}

function renderPreview() {
  const box = $("#preview"); if (!box) return;
  const tab = activeTab();

function spinSelection(pid) {

  const r = sel.getRangeAt(0), node = r.startContainer;
  if (node !== r.endContainer || node.nodeType !== 3 || !node.parentElement || !node.parentElement.dataset.seg) { say("Select words inside one plain stretch, not across an existing spin point.", true); return; }
  const seg = p.segs.find(s => s.id === node.parentElement.dataset.seg); if (!seg) return;
  let a = r.startOffset, b = r.endOffset;
  while (a < b && /\s/.test(seg.text[a])) a++;

  const ns = spinSeg([mid]);

  p.segs = mergeFixed(p.segs);
  sel.removeAllRanges(); persist(); renderAll();
  if (dashKey) suggestOptions(ns.id); else say("Spin point added. Type options by hand, or open this tool from the dashboard to get suggestions.");
}

function openProjectFile(file) {

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); cur = ""; rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }

}

function automap() {

  for (const v of knownVars(fid)) {

    const cands = GUESS[vkey(v)] || [vkey(v)];
    const h = contacts.headers.find(x => cands.includes(vkey(x)));
    if (h) contacts.map[v] = h;
  }
}
